name: Nibfin Rescue
run-name: 'Rescue | #${{ inputs.nibfin_issue }} | ${{ inputs.nibfin_stage }} | ${{ inputs.mode }} | op:${{ inputs.nibfin_correlation }}'
on:
  workflow_dispatch:
    inputs:
      request_id: {type: string, required: true, description: Retained recovery case identity}
      source_run_id: {type: string, required: true, description: Original source Run}
      source_attempt: {type: string, required: true, description: Original source Attempt}
      nibfin_correlation: {type: string, required: true, description: Immutable dispatch operation}
      nibfin_issue: {type: string, required: true, description: Display only; checked against the retained case}
      nibfin_stage: {type: string, required: true, description: Blocked stage verified against the retained case}
      mode: {type: choice, required: true, default: repair, options: [repair, diagnose, verify]}
permissions: {}
jobs:
  rescue:
    runs-on: ubuntu-latest
    environment: nibfin-hosted
    permissions: {contents: read, actions: read, id-token: write}
    concurrency:
      group: nibfin-v1-${{ github.repository_id }}-repository-write
      cancel-in-progress: false
      queue: max
    steps:
      - name: Validate immutable installation pins
        shell: bash
        env:
          BUNDLE: ${{ vars.NIBFIN_BUNDLE_COMMIT }}
          HOST: ${{ vars.NIBFIN_HOST_COMMIT }}
        run: '[[ "$BUNDLE" =~ ^[a-f0-9]{40}$ && "$HOST" =~ ^[a-f0-9]{40}$ ]]'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: taco3064/nibfin
          ref: ${{ vars.NIBFIN_BUNDLE_COMMIT }}
          persist-credentials: false
          path: nibfin-bundle
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ vars.NIBFIN_HOST_REPOSITORY }}
          ref: ${{ vars.NIBFIN_HOST_COMMIT }}
          persist-credentials: false
          path: nibfin-host
      - id: entry
        uses: ./nibfin-bundle/workflow/action
        with:
          bundle_commit: ${{ vars.NIBFIN_BUNDLE_COMMIT }}
          host_commit: ${{ vars.NIBFIN_HOST_COMMIT }}
          mode: rescue
          read_token: ${{ github.token }}
          input: ${{ toJSON(inputs) }}
          host_token: ${{ secrets.NIBFIN_HOST_TOKEN }}

