name: Core package
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    # PRs use affected suites; main retains full source and installed consumers.
    timeout-minutes: 30
    env:
      NIBFIN_CI_PLAN: ${{ runner.temp }}/nibfin-ci-plan.json
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.3'
      - name: Verify CI completion notification boundaries
        run: node .github/tests/ci-kairo-wakeup.test.cjs
      - name: Verify scoped test selection
        run: node --test .github/tests/pr-test-plan.test.mjs
      - name: Plan tests from the PR change set
        id: plan
        run: node tooling/ci-tests.mjs plan
      - name: Check changed module syntax
        run: node tooling/ci-tests.mjs syntax
      - run: npm ci --registry=https://registry.npmjs.org --ignore-scripts --no-audit --no-fund
      - name: Provision pinned artifact SDK test runtime
        if: steps.plan.outputs.sdk == 'true'
        run: |
          sdk_root="$RUNNER_TEMP/nibfin-artifact-sdk"
          echo "NIBFIN_ARTIFACT_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          npm install --prefix "$sdk_root" --registry=https://registry.npmjs.org --save-exact --ignore-scripts --no-audit --no-fund @actions/artifact@2.3.2
      - run: npm run test:artifact-sdk
        if: steps.plan.outputs.sdk == 'true'
      - name: Run selected regression suites
        run: node tooling/ci-tests.mjs run
      - run: npm run verify:archive
        if: steps.plan.outputs.archive == 'true'
