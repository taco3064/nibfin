name: Kairo public dispatch
on:
  issues:
    types: [opened, edited, labeled, unlabeled, reopened, closed, milestoned, demilestoned]
  workflow_dispatch:
  # Recovery/renewal fallback; Issue updates are the primary wake-up.
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Authenticate repository binding
        id: dispatch
        env:
          KAIRO_RUNNER_KEY: ${{ secrets.KAIRO_RUNNER_KEY }}
          REPOSITORY_ID: ${{ github.repository_id }}
          OWNER_ID: ${{ github.repository_owner_id }}
          ACTOR_ID: ${{ github.actor_id }}
        shell: bash
        run: |
          node <<'NODE'
          const { createHmac, randomBytes } = require('node:crypto');
          const { readFileSync, writeFileSync, appendFileSync } = require('node:fs');
          const e = process.env;
          if (!e.KAIRO_RUNNER_KEY) { console.log('BLOCKED: no runner binding; no dispatch created.'); process.exit(0); }
          let key;
          try { key = JSON.parse(e.KAIRO_RUNNER_KEY); } catch { throw new Error('Invalid runner key encoding'); }
          const b = key.binding;
          if (!b || b.repository !== e.GITHUB_REPOSITORY || b.repositoryId !== e.REPOSITORY_ID || b.ownerId !== e.OWNER_ID || e.ACTOR_ID !== e.OWNER_ID || !/^[a-f0-9]{64}$/.test(key.secret || '')) throw new Error('Runner binding mismatch');
          const eventName = e.GITHUB_EVENT_NAME;
          if (!['issues', 'workflow_dispatch', 'schedule'].includes(eventName)) throw new Error('Unsupported wake-up event');
          let eventAction = '', issueId = null, issueNumber = null;
          if (eventName === 'issues') {
            const event = JSON.parse(readFileSync(e.GITHUB_EVENT_PATH, 'utf8'));
            const actions = ['opened', 'edited', 'labeled', 'unlabeled', 'reopened', 'closed', 'milestoned', 'demilestoned'];
            if (!actions.includes(event.action) || String(event.repository?.id) !== b.repositoryId || String(event.repository?.owner?.id) !== b.ownerId || String(event.sender?.id) !== b.ownerId || String(event.issue?.user?.id) !== b.ownerId || event.issue?.pull_request || !/^[A-Za-z0-9_-]+$/.test(event.issue?.node_id || '') || !Number.isSafeInteger(event.issue?.number) || event.issue.number < 1) { console.log('BLOCKED: untrusted Issue update; no dispatch created.'); process.exit(0); }
            eventAction = event.action; issueId = event.issue.node_id; issueNumber = event.issue.number;
          }
          const issuedAt = Date.now();
          const payload = { schemaVersion: 2, operation: 'reevaluate', repository: b.repository, repositoryId: b.repositoryId, runnerId: b.runnerId, bindingId: b.bindingId, runId: e.GITHUB_RUN_ID, runAttempt: Number(e.GITHUB_RUN_ATTEMPT), nonce: randomBytes(16).toString('hex'), issuedAt, expiresAt: issuedAt + 86400000, eventName, eventAction, issueId, issueNumber };
          const canonical = JSON.stringify(payload, Object.keys(payload).sort());
          const signature = createHmac('sha256', Buffer.from(key.secret, 'hex')).update(canonical).digest('hex');
          writeFileSync('dispatch.json', JSON.stringify({ payload, signature }));
          appendFileSync(e.GITHUB_OUTPUT, 'created=true\n');
          NODE
      - name: Publish authenticated wake-up
        if: steps.dispatch.outputs.created == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kairo-dispatch
          path: dispatch.json
          retention-days: 1
          if-no-files-found: error
