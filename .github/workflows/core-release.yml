name: Core immutable release
on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'
      - 'skills/**'
      - 'instructions/**'
      - 'workflow/**'
      - 'docs/**'
      - 'README.md'
      - 'examples/**'
      - 'tooling/**'
      - 'test/**'
      - '.github/workflows/nibfin-*.yml'
      - '.github/workflows/core-release.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nibfin-core-publication
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'taco3064/nibfin' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.3'
      - run: npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
      - name: Provision pinned artifact SDK test runtime
        run: |
          sdk_root="$RUNNER_TEMP/nibfin-artifact-sdk"
          echo "NIBFIN_ARTIFACT_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          npm install --prefix "$sdk_root" --registry=https://registry.npmjs.org --save-exact --ignore-scripts --no-audit --no-fund @actions/artifact@2.3.2
      - run: npm run test:artifact-sdk
      - run: npm run check
      - name: Prepare merged-source release
        run: node tooling/release.mjs
        env:
          NIBFIN_RELEASE_BASE: ${{ github.sha }}
          NIBFIN_RELEASE_COMMIT: ${{ github.sha }}
      - run: npm run verify:release
      - name: Publish and read back immutable release
        run: node tooling/release-publish.mjs
        env:
          NIBFIN_RELEASE_TOKEN: ${{ secrets.NIBFIN_RELEASE_TOKEN }}
      - name: Retain publication source and result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: core-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/
          if-no-files-found: error
