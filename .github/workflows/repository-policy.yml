name: Repository PR policy
on:
  push:
    branches: [main]
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
jobs:
  owner-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require repository owner as PR author
        env:
          OWNER_ID: ${{ github.repository_owner_id }}
          PR_AUTHOR_ID: ${{ github.event.pull_request.user.id }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          node <<'NODE'
          if (process.env.EVENT_NAME === 'pull_request_target' && process.env.PR_AUTHOR_ID !== process.env.OWNER_ID) {
            console.error('Only the repository owner may submit a mergeable pull request.');
            process.exit(1);
          }
          NODE
