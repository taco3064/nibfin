name: Website CI
on:
  pull_request:
    paths: ['website/**', '.github/workflows/website-ci.yml']
  push:
    branches: [main]
    paths: ['website/**', '.github/workflows/website-ci.yml']
permissions:
  contents: read
jobs:
  website:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.3'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm run evidence
      - run: npx playwright install --with-deps chromium
      - run: npm run evidence:theme
      - run: npm run evidence:site
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: website-quality-${{ github.run_id }}-${{ github.run_attempt }}
          path: website/out/
          if-no-files-found: error
      - run: node --input-type=module -e "import { verifyBuild } from './tooling/build-identity.mjs'; verifyBuild()"
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.ref_protected }}
        with:
          path: website/dist
  deploy:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.ref_protected }}
    needs: website
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.3'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: website-quality-${{ github.run_id }}-${{ github.run_attempt }}
          path: website/out
      - run: node tooling/pages-configuration.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
        with:
          enablement: false
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
      - run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          mkdir dist
          tar -xzf out/site.tar.gz -C dist
          npm run evidence:live
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
          DEPLOYMENT_RESULT: ${{ steps.deployment.outcome }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: website-live-${{ github.run_id }}-${{ github.run_attempt }}
          path: website/out/
          if-no-files-found: error
