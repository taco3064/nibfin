name: Nibfin independent stage v1
run-name: '#${{ inputs.nibfin_issue }} | ${{ inputs.nibfin_stage }} | op:${{ inputs.nibfin_correlation }}'
on:
  workflow_dispatch:
    inputs:
      nibfin_request: {type: string, required: true}
      nibfin_correlation: {type: string, required: true}
      nibfin_issue: {type: string, required: true, description: Display issue verified against the retained request}
      nibfin_stage: {type: string, required: true, description: Intended stage verified against the retained request}
permissions: {}
jobs:
  lookup:
    runs-on: ubuntu-latest
    environment: nibfin-hosted
    permissions: {contents: read, actions: read, id-token: write}
    concurrency:
      group: nibfin-v1-${{ github.repository_id }}-repository-write
      cancel-in-progress: false
      queue: max
    outputs:
      issue: ${{ steps.entry.outputs.issue }}
    steps:
      - name: Validate immutable installation pins
        shell: bash
        env:
          BUNDLE: ${{ vars.NIBFIN_BUNDLE_COMMIT }}
          HOST: ${{ vars.NIBFIN_HOST_COMMIT }}
        run: '[[ "$BUNDLE" =~ ^[a-f0-9]{40}$ && "$HOST" =~ ^[a-f0-9]{40}$ ]]'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: taco3064/nibfin
          ref: ${{ vars.NIBFIN_BUNDLE_COMMIT }}
          persist-credentials: false
          path: nibfin-bundle
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ vars.NIBFIN_HOST_REPOSITORY }}
          ref: ${{ vars.NIBFIN_HOST_COMMIT }}
          persist-credentials: false
          path: nibfin-host
      - id: entry
        uses: ./nibfin-bundle/workflow/action
        with:
          bundle_commit: ${{ vars.NIBFIN_BUNDLE_COMMIT }}
          host_commit: ${{ vars.NIBFIN_HOST_COMMIT }}
          mode: lookup
          read_token: ${{ github.token }}
          input: ${{ toJSON(inputs) }}

  stage:
    needs: lookup
    uses: ./.github/workflows/nibfin-delivery.yml
    secrets:
      NIBFIN_HOST_TOKEN: ${{ secrets.NIBFIN_HOST_TOKEN }}
    permissions: {contents: read, actions: read, id-token: write}
    with:
      issue: ${{ needs.lookup.outputs.issue }}
      nibfin_request: ${{ inputs.nibfin_request }}
      nibfin_correlation: ${{ inputs.nibfin_correlation }}
      nibfin_issue: ${{ inputs.nibfin_issue }}
      nibfin_stage: ${{ inputs.nibfin_stage }}
