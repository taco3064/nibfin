name: upstream private runner
on:
  workflow_call:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: [self-hosted, linux, nibfin-private]
    outputs:
      private: ${{ steps.visibility.outputs.private }}
    steps:
      - id: visibility
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          test "$(gh api "repos/$REPOSITORY" --jq .private)" = true
          echo 'private=true' >> "$GITHUB_OUTPUT"
  resume:
    needs: preflight
    if: needs.preflight.outputs.private == 'true'
    runs-on: [self-hosted, linux, nibfin-private]
    concurrency:
      group: nibfin-private-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Resume installed pinned Core
        # No caller checkout and no event-selected executable/configuration path.
        # Enrollment installs this exact launcher and its trusted config.
        run: node /opt/nibfin/core/bin/controller.mjs watch /etc/nibfin/runtime.json
