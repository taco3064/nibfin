name: Core package
on:
  pull_request:
    paths:
      - 'src/**'
      - 'skills/**'
      - 'test/**'
      - 'test-sdk/**'
      - 'tooling/**'
      - 'docs/**'
      - 'README.md'
      - 'package.json'
      - 'package-lock.json'
      - '.gitignore'
      - '.github/workflows/core-ci.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'skills/**'
      - 'test/**'
      - 'test-sdk/**'
      - 'tooling/**'
      - 'docs/**'
      - 'README.md'
      - 'package.json'
      - 'package-lock.json'
      - '.gitignore'
      - '.github/workflows/core-ci.yml'
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --registry=https://registry.npmjs.org --ignore-scripts --no-audit --no-fund
      - name: Provision pinned artifact SDK test runtime
        run: |
          sdk_root="$RUNNER_TEMP/nibfin-artifact-sdk"
          echo "NIBFIN_ARTIFACT_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          npm install --prefix "$sdk_root" --registry=https://registry.npmjs.org --save-exact --ignore-scripts --no-audit --no-fund @actions/artifact@2.3.2
      - run: npm run test:artifact-sdk
      - run: npm run check
      - run: npm run verify:archive
