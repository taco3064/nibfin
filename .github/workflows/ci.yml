name: CI
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  owner-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      core: ${{ steps.plan.outputs.core }}
      website: ${{ steps.plan.outputs.website }}
      controller: ${{ steps.plan.outputs.controller }}
    env:
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Require repository owner as PR author
        env:
          OWNER_ID: ${{ github.repository_owner_id }}
          PR_AUTHOR_ID: ${{ github.event.pull_request.user.id }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          node <<'NODE'
          if (process.env.EVENT_NAME === 'pull_request' && process.env.PR_AUTHOR_ID !== process.env.OWNER_ID) {
            console.error('Only the repository owner may submit a mergeable pull request.');
            process.exit(1);
          }
          NODE
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.3'
      - name: Verify scoped job and test selection
        run: node --test .github/tests/pr-test-plan.test.mjs
      - name: Verify generated distribution map against exact source bytes
        run: node tooling/distribution-map.mjs
      - name: Select jobs before allocating their runners
        id: plan
        run: node tooling/ci-tests.mjs plan
  core:
    needs: owner-pr
    if: needs.owner-pr.outputs.core == 'true'
    runs-on: ubuntu-latest
    # PRs use affected suites; main retains full source and installed consumers.
    timeout-minutes: 30
    env:
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.3'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        id: supervisor-python
        with:
          python-version: '3.11'
      - name: Provision and probe the fixed verification runtime
        env:
          SUPERVISOR_PYTHON: ${{ steps.supervisor-python.outputs.python-path }}
        run: |
          # Only this disposable CI job: match the supported role image's fixed
          # interpreter and service PATH instead of inheriting ubuntu-latest.
          sudo ln -sf "$SUPERVISOR_PYTHON" /usr/bin/python3
          sudo ln -sf "$(command -v node)" /usr/local/bin/node
          sudo ln -sf "$(command -v npm)" /usr/local/bin/npm
          env -i PATH=/usr/local/bin:/usr/bin:/bin /usr/local/bin/node --version
          env -i PATH=/usr/local/bin:/usr/bin:/bin /usr/local/bin/npm --version
          env -i PATH=/usr/bin:/bin /usr/bin/python3 -I -S src/verification-supervisor.py --probe
      - name: Verify scoped test selection
        run: node --test .github/tests/pr-test-plan.test.mjs
      - name: Plan tests from the PR change set
        id: plan
        run: node tooling/ci-tests.mjs plan
      - name: Check changed module syntax
        run: node tooling/ci-tests.mjs syntax
      - run: npm ci --registry=https://registry.npmjs.org --ignore-scripts --no-audit --no-fund
      - name: Provision pinned artifact SDK test runtime
        if: steps.plan.outputs.sdk == 'true'
        run: |
          sdk_root="$RUNNER_TEMP/nibfin-artifact-sdk"
          echo "NIBFIN_ARTIFACT_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          npm install --prefix "$sdk_root" --registry=https://registry.npmjs.org --save-exact --ignore-scripts --no-audit --no-fund @actions/artifact@2.3.2
      - run: npm run test:artifact-sdk
        if: steps.plan.outputs.sdk == 'true'
      - name: Run selected regression suites
        run: node tooling/ci-tests.mjs run
      - run: npm run verify:archive
        if: steps.plan.outputs.archive == 'true'
  controller:
    needs: owner-pr
    if: needs.owner-pr.outputs.controller == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.3'
      - run: npm run check
        working-directory: controller
      - run: npm test
        working-directory: controller
  website:
    needs: owner-pr
    if: needs.owner-pr.outputs.website == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    outputs:
      quality-artifact-id: ${{ steps.quality.outputs.artifact-id }}
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.3'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Plan website checks from the PR change set
        id: plan
        working-directory: .
        run: node tooling/ci-tests.mjs plan
      - run: npm run evidence
        if: steps.plan.outputs.website == 'true'
      - run: npx playwright install --with-deps chromium
        if: steps.plan.outputs.website == 'true'
      - run: npm run evidence:theme
        if: steps.plan.outputs.website == 'true'
      - run: npm run evidence:site
        if: steps.plan.outputs.website == 'true'
      - id: quality
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() && steps.plan.outputs.website == 'true' }}
        with:
          name: website-quality-${{ github.run_id }}-${{ github.run_attempt }}
          path: website/out/
          if-no-files-found: error
      - run: node --input-type=module -e "import { verifyBuild } from './tooling/build-identity.mjs'; verifyBuild()"
        if: steps.plan.outputs.website == 'true'
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.ref_protected }}
        with:
          path: website/dist
  deploy:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.ref_protected }}
    needs: website
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.3'
      - name: Require the immutable build artifact ID
        env:
          QUALITY_ARTIFACT_ID: ${{ needs.website.outputs.quality-artifact-id }}
        run: node -e "if (!/^[1-9][0-9]*$/.test(process.env.QUALITY_ARTIFACT_ID ?? '')) throw Error('Missing build artifact ID');"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.website.outputs.quality-artifact-id }}
          merge-multiple: true
          path: website/out
      - run: node tooling/pages-configuration.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
        with:
          enablement: false
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
      - run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          mkdir dist
          tar -xzf out/site.tar.gz -C dist
          npm run evidence:live
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
          DEPLOYMENT_RESULT: ${{ steps.deployment.outcome }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: website-live-${{ github.run_id }}-${{ github.run_attempt }}
          path: website/out/
          if-no-files-found: error
